<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ShopEase</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, Helvetica, sans-serif; background: #f8fafc; color: #0f172a; line-height: 1.6; }
        .container { width: min(1200px, 92%); margin: auto; }
        
        /* Header */
        header { background: white; border-bottom: 1px solid #f1f5f9; position: sticky; top: 0; z-index: 100; }
        .navbar { min-height: 70px; display: flex; justify-content: space-between; align-items: center; }
        .logo { color: #000; font-size: 2.5rem; font-weight: 900; text-decoration: none; }
        .nav-btn { background: #eff6ff; color: #3b82f6; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; }
        
        /* Page Content */
        .page-header { background: #16a34a; color: white; padding: 60px 20px; text-align: center; }
        .page-header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        
        .contact-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; max-width: 900px; margin: 40px auto; }
        .contact-form { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #475569; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        .submit-btn { background: #16a34a; color: white; border: none; padding: 15px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        
        .contact-info { display: flex; flex-direction: column; justify-content: center; gap: 30px; }
        .info-card { background: #f0fdf4; padding: 30px; border-radius: 12px; border: 2px solid #bbf7d0; display: flex; align-items: center; gap: 20px; }
        .info-card i { font-size: 2rem; color: #22c55e; }
        
        @media (max-width: 768px) { .contact-layout { grid-template-columns: 1fr; } }
        
        /* Footer (Same as About) */
        .new-footer { background: white; padding: 60px 0 20px; border-top: 1px solid #f1f5f9; margin-top: 60px;}
        .footer-grid-new { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; margin-bottom: 40px; }
        .social-icons { display: flex; gap: 10px; margin-top: 20px; }
        .social-icon { width: 35px; height: 35px; background: #dcfce7; color: #22c55e; display: flex; align-items: center; justify-content: center; border-radius: 8px; text-decoration: none; }
        .footer-links a { color: #475569; text-decoration: none; display: block; margin-bottom: 12px; }
        .contact-box { background: #f0fdf4; border: 2px solid #bbf7d0; padding: 25px; border-radius: 16px; }
        .contact-row { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; color: #334155; }
        .contact-row i { color: #22c55e; font-size: 1.2rem; }
        .new-copyright { text-align: center; color: #64748b; border-top: 1px solid #f1f5f9; padding-top: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="/" class="logo">ShopEase</a>
            <div class="nav-actions">
                <a href="/" class="nav-btn"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </header>

    <div class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Have questions? We are here to help.</p>
        </div>
    </div>

    <main class="container">
        <div class="contact-layout">
            
            <div class="contact-form">
                <h2 style="margin-bottom: 25px; color: #0f172a;">Send us a message</h2>
                <form onsubmit="event.preventDefault(); alert('Message sent successfully! Our team will get back to you soon.'); this.reset();">
                    <div class="form-group">
                        <label>Your Name</label>
                        <input type="text" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" required placeholder="Enter your email address">
                    </div>
                    <div class="form-group">
                        <label>Your Message</label>
                        <textarea required rows="5" placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </div>

            <div class="contact-info">
                <div class="info-card">
                    <i class="fa-solid fa-phone-volume"></i>
                    <div>
                        <div style="color: #64748b; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">Call Us</div>
                        <div style="font-size: 1.2rem; font-weight: bold; color: #0f172a;">+91 7668133126</div>
                    </div>
                </div>
                
                <div class="info-card">
                    <i class="fa-regular fa-envelope"></i>
                    <div>
                        <div style="color: #64748b; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">Email Us</div>
                        <div style="font-size: 1.2rem; font-weight: bold; color: #0f172a;">support@shopease.com</div>
                    </div>
                </div>

                <div class="info-card">
                    <i class="fa-regular fa-clock"></i>
                    <div>
                        <div style="color: #64748b; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;">Working Hours</div>
                        <div style="font-size: 1.1rem; font-weight: bold; color: #0f172a;">Mon - Fri: 10:00 AM - 6:00 PM</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="new-footer">
        <div class="container">
            <div class="new-copyright">© 2026 ShopEase. All rights to Sharma ecommerce solution</div>
        </div>
    </footer>
</body>
</html>
